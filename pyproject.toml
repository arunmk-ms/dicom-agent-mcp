[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dicom-agent-mcp"
version = "0.1.0"
description = "MCP server that gives AI agents protocol-neutral DICOM tools (DIMSE and DICOMweb)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.9,<2",
    "pydicom>=3.0",
    "pynetdicom>=2.1",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2",
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Decoders for JPEG, JPEG-LS, JPEG 2000 and RLE compressed pixel data.
codecs = ["pylibjpeg>=2", "pylibjpeg-libjpeg>=2", "pylibjpeg-openjpeg>=2", "pylibjpeg-rle>=2"]

[project.scripts]
dicom-agent-mcp = "dicom_agent_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dicom_agent_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
